[package]
name = "compid"
version = "0.2.0"
edition = "2021"
authors = ["RXVEN-1907"]
description = "Binary provenance classifier - which compiler built this binary?"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RXVEN-1907/compid"
readme = "README.md"
keywords = ["binary-analysis", "provenance", "elf", "compiler-detection", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
goblin = "0.10.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaxpeax-arch = "0.3.3"
yaxpeax-x86 = "2.2.0"
flate2 = "1.1"

# Console VT enabling on Windows; empty everywhere else.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

# SIGPIPE restoration so `compid ... | head` exits quietly instead of
# panicking on a closed pipe.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true

# The robustness suite (tests/robustness_test.rs) runs thousands of mutated
# fixtures through the disassembler, which is too slow at opt-level 0 to hold
# the suite's wall-clock budget. A little optimization fixes that, while
# debug assertions and integer-overflow checks stay ON on purpose: an
# overflow panic on a crafted header is exactly what the suite exists to
# catch.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
